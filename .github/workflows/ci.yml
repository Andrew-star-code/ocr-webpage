name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m build
      - name: Validate wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          forbidden = ("tests/", "models/", "config/", "ollama/", ".env", "data/")
          assert any(name.startswith("app/") for name in names), names
          assert not any(name.startswith(forbidden) for name in names), names
          PY
      - run: python -m compileall -q app
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -W error::RuntimeWarning -m "not vlm_integration"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check app tests
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose -f docker-compose.yml -f docker-compose.cpu.yml config
      - run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config
      - run: docker compose --profile model-init config
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local-vision-ocr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm local-vision-ocr:test python -c "import app; import app.main"
