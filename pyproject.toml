[project]
name = "local-vision-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4", "httpx>=0.27", "PyMuPDF>=1.24", "Pillow>=10.4", "opencv-python-headless>=4.10", "python-docx>=1.1", "redis>=5", "dramatiq[redis]>=1.17", "prometheus-client>=0.20", "python-multipart>=0.0.9", "PyYAML>=6"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "build>=1.2"]
[tool.pytest.ini_options]
addopts = "-q -W error::RuntimeWarning"
asyncio_mode = "auto"
markers = ["vlm_integration: requires a local vision model"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["tests", "tests.*", "models", "models.*", "config", "config.*", "ollama", "ollama.*"]
