services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    networks: [public, internal]
    depends_on: [redis, ollama]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [ocr_data:/data]
  worker:
    build: .
    command: ["dramatiq", "app.workers.tasks", "--processes", "1", "--threads", "1"]
    env_file: .env
    networks: [internal]
    depends_on: [redis, ollama]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    volumes: [ocr_data:/data]
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    networks: [internal]
    volumes: [redis_data:/data]
  model-init:
    image: ollama/ollama:0.6.2
    profiles: [model-init]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; sleep 3; ollama pull $${BASE_VISION_MODEL:-qwen2.5vl:7b}; ollama create document-ocr -f /config/Modelfile; kill $$pid"]
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes: [ollama_models:/root/.ollama, ./ollama:/config:ro]
    networks: [model_setup]
  ollama:
    image: ollama/ollama:0.6.2
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "64"
    networks: [internal]
    volumes: [ollama_models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
networks:
  public: {}
  internal:
    internal: true
  model_setup: {}
volumes:
  redis_data: {}
  ollama_models: {}
  ocr_data: {}
